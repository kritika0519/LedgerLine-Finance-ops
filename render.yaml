services:
  - type: web
    name: ledgerline-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_CORS_ORIGINS
        sync: false
      - key: AI_INVESTIGATION_PROVIDER
        value: deterministic
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "15"
